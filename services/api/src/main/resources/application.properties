
spring.application.name=coffee-flower-bff

# Configuración del servidor
server.port=${PORT:8080}

# Configuración de la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://coffee-flower-frontend.vercel.app}

# Seguridad del API Gateway
app.gateway.secret=${GATEWAY_SECRET}

# Kafka productor: broker interno de la red de docker (definido en docker-compose.yml)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
app.kafka.topic=${KAFKA_TOPIC:pagos}
app.kafka.origen=${KAFKA_ORIGEN:api}

# Amazon SNS: región y tópico para eventos de pedidos
app.aws.region=${AWS_REGION:${APP_AWS_REGION:us-east-1}}
app.aws.sns.topic-arn=${SNS_TOPIC_ARN:}

# Amazon SNS: tópico exclusivo para informes mensuales
app.aws.sns.report-topic-arn=${AWS_SNS_TOPIC_ARN:}

# Destinatario del informe mensual
app.informe.email-destino=${INFORME_EMAIL_DESTINO:barbyd1107@gmail.com}

# Correo usado para enviar el informe (secretos via env_file en el EC2)
spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:barbyd1107@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
